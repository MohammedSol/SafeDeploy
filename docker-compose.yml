services:

  # ----------------------------------------------------------------
  # PostgreSQL 16 — base de données principale
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16.3-alpine
    container_name: safedeploy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backend/data/sales.csv:/seed-sales.csv:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - safedeploy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------
  # MLflow — tracking server + model registry
  # Lancé avec --serve-artifacts : les modèles sont servis en HTTP,
  # pas besoin de volume partagé avec le backend ou le trainer.
  # ----------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: safedeploy_mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/mlflow.db}
      --serve-artifacts
      --artifacts-destination ${MLFLOW_ARTIFACTS_DESTINATION:-/mlflow/artifacts}
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    networks:
      - safedeploy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  trainer:
    image: python:3.11-slim
    profiles: ["training"]
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - safedeploy_net
    depends_on:
      mlflow:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        python -m pip install mlflow==2.19.0 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 xgboost==3.2.0
        python -m backend.ml.train

# ----------------------------------------------------------------
# Volumes nommés — les données persistent entre `make down` et `make up`
# ----------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  mlflow_data:
    driver: local

# ----------------------------------------------------------------
# Réseau dédié — isolation des services SafeDeploy
# ----------------------------------------------------------------
networks:
  safedeploy_net:
    driver: bridge
